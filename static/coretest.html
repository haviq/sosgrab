<!DOCTYPE html><html><body><pre id="out">testing...</pre>
<script src="/static/ffmpeg/ffmpeg.js"></script>
<script>
(function(){
  var out = function(m){ document.getElementById('out').textContent += '\n' + m; };
  out('FFmpegWASM: ' + (typeof FFmpegWASM));
  var origin = location.origin;
  var ff = new FFmpegWASM.FFmpeg();
  ff.on('log', function(l){ out('[log] ' + l.message); });
  ff.load({
    coreURL: origin + '/static/ffmpeg/ffmpeg-core.js',
    wasmURL: origin + '/static/ffmpeg/ffmpeg-core.wasm',
    classWorkerURL: origin + '/static/ffmpeg/814.ffmpeg.js'
  }).then(function(){ out('✅ LOAD OK — ffmpeg core loaded!'); })
    .catch(function(e){ out('❌ LOAD FAIL: ' + (e && e.message || e)); });
})();
</script>
</body></html>
